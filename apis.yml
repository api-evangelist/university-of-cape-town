x-attribution-correction:
  date: '2026-08-30'
  pipeline: pipeline-university
  removed_vendor_contracts: 4
  detail: >-
    Four Figshare contracts and ten derived artifacts were removed from this
    repo. openapi/_original/university-of-cape-town-zivahub-figshare.yaml and
    its three refine-split outputs (articles, collections, projects) all declared
    servers[0].url https://api.figshare.com/v2 and info.contact "Figshare
