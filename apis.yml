aid: university-of-cape-town
name: University of Cape Town
x-type: university
x-category: Public Research University
description: >-
  The University of Cape Town (UCT) is South Africa's oldest and highest-ranked
  public research university and the top-ranked institution on the African
  continent. UCT operates no central developer portal and publishes no
  institution-wide API programme; its student-information, finance, HR and
  learning-management systems are vendor platforms behind institutional
  authentication and are not programmable from outside. What UCT does operate
  itself is a small, genuinely first-party research-data footprint: DataFirst, a
  UCT research unit, runs a NADA microdata catalog on www.datafirst.uct.ac.za
  with a public unauthenticated REST/JSON API over 582 studies; OpenUCT, the
  institutional repository, runs DSpace 7.4 on open.uct.ac.za and exposes both
  an OAI-PMH 2.0 harvesting endpoint and the DSpace REST API anonymously; and
  UCT's ICTS operates a SAML 2.0 identity provider registered in the South
  African Identity Federation (SAFIRE) and published to eduGAIN. UCT is a
  DataCite direct member (symbol DAFI, ROR 03p74gp79) minting under prefixes
  10.25828 and 10.25375. ZivaHub, the open data repository, is a Figshare for
  Institutions tenancy — zivahub.uct.ac.za CNAMEs to figshare.com — so the data
  is UCT's and the API contract is Figshare's; it is recorded here as a tenant
  relationship and is deliberately not scored as UCT engineering.
