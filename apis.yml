    apis.yml entries for them additionally carried a WELD: they were based on
    www.datafirst.uct.ac.za while the specs underneath said api.figshare.com, so
    a single vendor contract was presenting as three UCT APIs on a UCT host. The
    relationship is preserved as the ZivaHub tenant entry above; only the
    misattributed engineering credit is gone.
