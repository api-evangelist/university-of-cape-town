- aid: university-of-cape-town:identity-provider
  name: UCT Identity Provider (SAML 2.0 / SAFIRE / eduGAIN)
  x-operator: institution
  x-surface-class: IdentityFederation
  description: >-
    UCT's Information and Communication Technology Services operates a SAML 2.0
    identity provider registered in the South African Identity Federation
    (SAFIRE, registry id 000002) and published onward to eduGAIN. Confirmed in
    SAFIRE's signed production metadata on 2026-08-30: entityID
    https://srvslsfed001.uct.ac.za/simplesaml/saml2/idp/metadata.php,
    schacHomeOrganization uct.ac.za, homeOrganizationType university, scopes
    uct.ac.za / wf.uct.ac.za / ^([a-z0-9]{1,63})\.uct\.ac\.za$, REFEDS Research
    & Scholarship and Anonymous entity categories, SIRTFI assurance, and a
    published CSIRT security contact. This is a machine-readable,
    institution-operated surface — it is not a REST API and has no token
    endpoint an agent can call, but it is the one interface UCT publishes to the
    world that is unambiguously its own engineering. UCT publishes the metadata
    itself at idp.uct.ac.za (200, application/samlmetadata+xml, 2026-08-30);
    the entityID hostname srvslsfed001.uct.ac.za is an internal name that does
    not resolve publicly, which is normal for a SAML entityID.
  humanURL: https://icts.uct.ac.za/
  baseURL: https://idp.uct.ac.za/simplesaml/saml2/idp/metadata.php
  x-entity-id: https://srvslsfed001.uct.ac.za/simplesaml/saml2/idp/metadata.php
