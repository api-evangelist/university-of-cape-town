  description: >-
    ZivaHub is UCT's institutional open data repository for research data and
    scholarly outputs. It is a Figshare for Institutions TENANCY, not a UCT
    system: zivahub.uct.ac.za CNAMEs to figshare.com, and public ZivaHub content
    is served by the shared api.figshare.com/v2 endpoint that every Figshare
    customer calls. The deposits, the DOIs (minted through DataCite client
    figshare.uct under UCT's DAFI membership) and the CoreTrustSeal
    certification are UCT's; the API contract is Figshare's. No Figshare OpenAPI
    is stored under this institution — four such specs were removed from this
    repo on 2026-08-30 — and the contract is scored against Figshare's own repo
    where it belongs. This entry records a real institutional relationship, not
    a UCT API.
