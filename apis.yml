x-coverage:
  state: covered
  reason: covered
  detail: >-
    Four institution-operated surfaces were found and probed live on 2026-08-30
    — the DataFirst NADA catalog API, the OpenUCT OAI-PMH endpoint, the OpenUCT
    DSpace REST API, and UCT's SAML 2.0 identity provider in SAFIRE/eduGAIN —
    plus one tenant relationship (ZivaHub on Figshare for Institutions). UCT
    still has no central developer portal, no course-catalog or timetable API,
    no campus-life API and no public API programme; the classes hunted and not
    found are listed under surfaces_absent. Coverage is `covered` rather than
    `none` because real first-party machine-readable surfaces exist and are
    documented here, not because the footprint is large.
  generated: '2026-08-30'
  method: probed
  surfaces_absent:
    - class: CourseCatalog
      detail: >-
        No api.uct.ac.za or courses.uct.ac.za responded (both timed out at the
        network layer); no student-built, institution-blessed timetable API of
        the UCLAPI / NUSMods kind was found for UCT.
    - class: OpenDataPortal
      detail: data.uct.ac.za does not resolve; there is no CKAN or Socrata portal.
    - class: LearningManagementSystem
      detail: >-
        Amathuba (D2L Brightspace) and legacy Vula (Sakai) are vendor platforms
        behind authentication; no UCT-published LTI or Caliper surface.
    - class: LibraryCatalog
      detail: >-
        Discovery runs on a vendor stack; no UCT-operated catalog API found.
    - class: CampusLife
      detail: No transit, dining, occupancy, room-booking or printing API found.
