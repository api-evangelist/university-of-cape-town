  - name: DataFirst Microdata Catalog API (NADA)
    x-operator: institution
    base_url: https://www.datafirst.uct.ac.za/dataportal/index.php/api
    scheme: none
    public_read: true
    api_key_required: false
    signup_required: false
    evidence:
      - url: https://www.datafirst.uct.ac.za/dataportal/index.php/api/catalog?limit=2
        status: 200
        note: >-
          Returned 582 studies with no credential of any kind, no cookie and no
          Authorization header.
    notes: >-
      Catalog METADATA is fully open. The underlying microdata is not: studies
      carry form_model / data_access_type values such as `licensed`, and
