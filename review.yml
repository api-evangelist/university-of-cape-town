- date: '2026-08-30'
  rating: 3
  pipeline: pipeline-university
  summary: 'Re-profiled under the university pipeline, which settles WHO OPERATES each surface before
    saving any contract. Four institution-operated surfaces verified live: the DataFirst NADA catalog
    API (582 studies; five operations re-probed, up from the two recorded in June), the OpenUCT OAI-PMH
    2.0 endpoint, the OpenUCT DSpace 7.4 REST API, and — a new find — UCT''s own SAML 2.0 identity provider,
    published by UCT at idp.uct.ac.za as application/samlmetadata+xml and registered in SAFIRE (registry
    id 000002) with REFEDS R&S and SIRTFI, exported to eduGAIN. Four Figshare contracts were REMOVED:
    they declared api.figshare.com and Figshare Support, a host four other institutions in this cohort
    also claimed, while the apis.yml entries welded them onto www.datafirst.uct.ac.za so one vendor contract
    read as three UCT APIs. ZivaHub is retained as a tenant relationship — zivahub.uct.ac.za CNAMEs to
    figshare.com. Domain-standard conformance evidenced for oai-pmh, saml and datacite. No course-catalog,
    open-data-portal or campus-life API exists. Expect the composite score to FALL; the June number was
    partly Figshare''s.'
