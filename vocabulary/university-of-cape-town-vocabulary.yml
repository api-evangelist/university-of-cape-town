vocabulary:
  name: University of Cape Town API Vocabulary
  description: >-
    Terms used across the surfaces the University of Cape Town itself operates:
    the DataFirst NADA microdata catalog API on www.datafirst.uct.ac.za, and the
    OpenUCT DSpace repository (OAI-PMH and REST) on open.uct.ac.za. Terms
    belonging to vendor contracts UCT merely consumes — the Figshare API behind
    the ZivaHub tenancy — are deliberately not defined here.
  version: '2.0.0'
  terms:
    - term: Study
      definition: >-
        A survey or administrative microdata dataset cataloged in the DataFirst
        NADA portal, described by metadata including country and time coverage.
      tags: [datafirst, nada, microdata, survey]
    - term: idno
      definition: >-
        The persistent study identifier used by the DataFirst NADA catalog, and
        the only key that addresses a study on /catalog/{idno} — a numeric id
        returns 400 IDNO-NOT-FOUND.
      tags: [datafirst, nada, identifier]
    - term: DataFile
      definition: >-
        One data file belonging to a DataFirst study, keyed by file id (F1, F3,
        F4 …) and carrying case and variable counts.
      tags: [datafirst, nada, microdata]
    - term: Variable
      definition: >-
        A single measured variable inside a DataFirst data file, identified by
        file id plus variable id and carrying a name and a label.
      tags: [datafirst, nada, microdata]
    - term: form_model
      definition: >-
        The access model for a DataFirst study (for example licensed or open),
        governing how the underlying microdata may be obtained.
      tags: [datafirst, access, licensing]
    - term: repositoryid
      definition: >-
        The code of the owning collection inside the DataFirst catalog (for
        example ALPHA for the ALPHA Network).
      tags: [datafirst, nada, collection]
    - term: OAI-PMH
      definition: >-
        The Open Archives Initiative Protocol for Metadata Harvesting, version
        2.0, exposed by OpenUCT at /server/oai/request with verbs Identify,
        ListMetadataFormats, ListSets and ListRecords.
      tags: [openuct, dspace, metadata-harvesting, standard]
    - term: Item
      definition: >-
        A deposited object in the OpenUCT DSpace repository — a thesis,
        dissertation, article, report or open educational resource.
      tags: [openuct, dspace, repository]
    - term: Handle
      definition: >-
        A Handle System persistent identifier assigned to an OpenUCT item, under
        UCT's 11427 prefix (oai:open.uct.ac.za:11427/…).
      tags: [openuct, identifier, persistent]
    - term: DOI
      definition: >-
        A Digital Object Identifier providing a persistent reference to a
        research output. UCT is a DataCite direct member (provider symbol DAFI)
        and mints under prefixes including 10.25828 (DataFirst) and 10.25375.
      tags: [identifier, persistent, datacite]
    - term: ROR
      definition: >-
        The Research Organization Registry identifier for the institution,
        https://ror.org/03p74gp79.
      tags: [identifier, organization]
    - term: entityID
      definition: >-
        The SAML 2.0 identifier of UCT's identity provider in the South African
        Identity Federation (SAFIRE), exported to eduGAIN.
      tags: [identity, saml, safire, edugain]
    - term: schacHomeOrganization
      definition: >-
        The SCHAC attribute asserting the home organization of a UCT identity —
        uct.ac.za — carried in SAFIRE metadata.
      tags: [identity, saml, attribute]
    - term: ORCID
      definition: An Open Researcher and Contributor ID identifying an author.
      tags: [author, identifier]
